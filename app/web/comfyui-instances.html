<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ComfyUI 实例管理 · 管理</title>
  <link rel="stylesheet" href="/app/web/assets/management.css">
</head>
<body data-page="comfyui-instances">
  <a class="skip-link" href="#generation-resource-content">跳到主要内容</a>
  <main id="generation-resource-content" class="manage-shell">
    <nav id="management-navigation" class="management-navigation" data-management-page-id="comfyui-instance-management" data-management-initial-focus="#comfyui-instance-search" aria-label="管理菜单"></nav>
    <div class="generation-model-section list-view">
      <header class="resource-section-heading page-heading">
        <div class="page-heading-copy"><h1 id="comfyui-instance-heading">ComfyUI 实例管理</h1><p>维护 ComfyUI 服务连接、凭据和启用状态。</p></div>
        <button type="button" class="accent-button" data-action="open-comfyui-instance-create">新增 ComfyUI 实例</button>
      </header>
      <form id="comfyui-instance-filter-form" class="manage-toolbar" aria-label="ComfyUI 实例筛选">
        <label>关键词<input id="comfyui-instance-search" type="search" placeholder="搜索实例名称、服务地址" autocomplete="off"></label>
        <label>凭据类型<select id="comfyui-instance-filter-credential"><option value="">全部类型</option><option value="none">无凭据</option><option value="http_basic">HTTP Basic</option><option value="bearer">Bearer Token</option></select></label>
        <label>验证状态<select id="comfyui-instance-filter-valid"><option value="">全部状态</option><option value="true">有效</option><option value="false">未验证或无效</option></select></label>
        <label>启用状态<select id="comfyui-instance-filter-enabled"><option value="">全部状态</option><option value="true">已启用</option><option value="false">未启用</option></select></label>
        <div class="filter-actions"><button type="submit" class="accent-button">搜索</button><button type="button" class="secondary-button" data-action="reset-filters">重置</button></div>
      </form>
      <p id="comfyui-instance-status" class="state-line" role="status" aria-live="polite" aria-busy="true">正在载入 ComfyUI 实例……</p>
      <p id="comfyui-instance-error" class="state-line error" role="alert" hidden></p>
      <section id="comfyui-instance-list" class="manage-list" aria-label="ComfyUI 实例列表"></section>
      <nav id="comfyui-instance-pagination" class="manage-pagination" aria-label="ComfyUI 实例分页"></nav>
    </div>
  </main>

  <dialog id="comfyui-instance-editor" class="manage-dialog model-editor" aria-labelledby="comfyui-instance-editor-title">
    <div class="dialog-heading"><div><h2 id="comfyui-instance-editor-title">新增 ComfyUI 实例</h2><p id="comfyui-instance-editor-subtitle" class="editor-subtitle"></p></div><button type="button" class="icon-button" data-action="close-comfyui-instance-editor" aria-label="关闭编辑弹窗">×</button></div>
    <div class="detail-body">
      <form id="comfyui-instance-form">
        <div class="model-form-grid">
          <label>名称<input name="title" required autocomplete="off"></label>
          <label>服务地址<input name="url" type="url" required autocomplete="url"></label>
          <label>凭据类型<select name="credential_type" required><option value="none">无凭据</option><option value="http_basic">HTTP Basic</option><option value="bearer">Bearer Token</option></select></label>
          <label class="comfyui-enabled-field"><input name="is_enabled" type="checkbox" disabled> 启用实例</label>
        </div>
        <div id="comfyui-instance-credential-fields"></div>
        <p id="comfyui-instance-validation-status" class="state-line" aria-live="polite">保存后可检测连接。</p>
        <p id="comfyui-instance-editor-error" class="state-line error" role="alert" hidden></p>
        <button type="button" class="secondary-button inline-validation-action" data-action="validate-comfyui-instance">检测连接</button>
      </form>
      <aside id="comfyui-instance-record-panel" class="editor-record-panel" aria-label="ComfyUI 实例记录信息" hidden><div class="record-placeholder" aria-hidden="true">实例</div><dl id="comfyui-instance-record-meta" class="record-meta"></dl></aside>
    </div>
    <div class="dialog-actions editor-dialog-actions"><button id="comfyui-instance-editor-delete" type="button" class="danger-button" data-action="open-comfyui-instance-delete" hidden>删除</button><button id="comfyui-instance-editor-submit" type="submit" form="comfyui-instance-form" class="accent-button">创建 ComfyUI 实例</button></div>
  </dialog>

  <dialog id="comfyui-instance-delete" class="manage-dialog confirm-dialog" aria-labelledby="comfyui-instance-delete-title">
    <div class="dialog-heading"><div><p class="eyebrow">危险操作</p><h2 id="comfyui-instance-delete-title">确认删除 ComfyUI 实例</h2></div><button type="button" class="icon-button" data-action="close-comfyui-instance-delete" aria-label="关闭 ComfyUI 实例删除预览">×</button></div>
    <p id="comfyui-instance-delete-target"></p>
    <p id="comfyui-instance-delete-error" class="state-line error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" class="secondary-button" data-action="close-comfyui-instance-delete">取消</button><button type="button" class="danger-button" data-action="confirm-comfyui-instance-delete">确认删除</button></div>
  </dialog>
  <!-- NOOBAI_RUNTIME_CONFIG -->
  <script src="/app/web/assets/runtime.js"></script>
  <script src="/app/web/assets/http-client.js"></script>
  <script src="/app/web/assets/pagination.js"></script>
  <script type="module" src="/app/web/assets/management-navigation.js"></script>
  <script type="module" src="/app/web/assets/comfyui-instance-management.js"></script>
</body>
</html>
