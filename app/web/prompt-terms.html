<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prompt Tag 管理 · BooruFlow</title>
  <link rel="stylesheet" href="/app/web/assets/management.css">
</head>
<body data-page="prompt-terms">
  <a class="skip-link" href="#prompt-term-content">跳到主要内容</a>
  <main id="prompt-term-content" class="manage-shell">
    <nav id="management-navigation" class="management-navigation" data-management-page-id="prompt-term-management" data-management-initial-focus="#prompt-term-search" aria-label="管理菜单"></nav>
    <div class="generation-model-section list-view">
      <header class="resource-section-heading page-heading"><div class="page-heading-copy"><h1>Prompt Tag 管理</h1><p>维护规范标签、别名、类别和关联图片数量。</p></div><button type="button" class="accent-button" data-action="open-create">新增 Prompt Tag</button></header>
      <form id="prompt-term-filter-form" class="manage-toolbar" aria-label="Prompt Tag 筛选">
        <label>关键词<input id="prompt-term-search" type="search" placeholder="搜索规范标签、别名、常见拼写、中文译名" autocomplete="off"></label>
        <label>类别<select id="prompt-term-filter-category"><option value="">全部类别</option></select></label>
        <label>关联图片数量下界<input id="prompt-term-filter-min" type="number" min="0" step="1" inputmode="numeric"></label>
        <label>关联图片数量上界<input id="prompt-term-filter-max" type="number" min="0" step="1" inputmode="numeric"></label>
        <div class="filter-actions"><button type="submit" class="accent-button">搜索</button><button type="button" class="secondary-button" data-action="reset-filters">重置</button></div>
      </form>
      <p id="prompt-term-status" class="state-line" role="status" aria-live="polite" aria-busy="true">正在载入 Prompt Tag……</p>
      <p id="prompt-term-error" class="state-line error" role="alert" hidden></p>
      <section id="prompt-term-list" class="manage-list" aria-label="Prompt Tag 列表"></section>
      <nav id="prompt-term-pagination" class="manage-pagination" aria-label="Prompt Tag 分页"></nav>
    </div>
  </main>

  <dialog id="prompt-term-editor" class="manage-dialog model-editor" aria-labelledby="prompt-term-editor-title">
    <div class="dialog-heading"><div><h2 id="prompt-term-editor-title">新增 Prompt Tag</h2><p id="prompt-term-editor-subtitle" class="editor-subtitle"></p></div><button type="button" class="icon-button" data-action="close-editor" aria-label="关闭编辑弹窗">×</button></div>
    <div class="detail-body"><form id="prompt-term-form">
      <div class="model-form-grid">
        <label>规范标签 *<input name="canonical_tag" required autocomplete="off"></label>
        <label>类别 *<select name="category" required></select></label>
        <label>关联图片数量 *<input name="post_count" type="number" min="0" step="1" required></label>
      </div>
      <label>别名、常见拼写与中文译名<textarea name="aliases" rows="8" placeholder="每行填写一个值"></textarea></label>
      <p id="prompt-term-editor-status" class="state-line" aria-live="polite"></p>
      <p id="prompt-term-editor-error" class="state-line error" role="alert" hidden></p>
    </form></div>
    <div class="dialog-actions editor-dialog-actions"><button id="prompt-term-delete-button" type="button" class="danger-button" data-action="open-delete" hidden>删除</button><button id="prompt-term-editor-submit" type="submit" form="prompt-term-form" class="accent-button">创建 Prompt Tag</button></div>
  </dialog>
  <dialog id="prompt-term-delete" class="manage-dialog confirm-dialog" aria-labelledby="prompt-term-delete-title">
    <div class="dialog-heading"><h2 id="prompt-term-delete-title">确认删除 Prompt Tag</h2><button type="button" class="icon-button" data-action="close-delete" aria-label="关闭删除确认">×</button></div>
    <p id="prompt-term-delete-copy"></p><div class="dialog-actions"><button type="button" class="secondary-button" data-action="close-delete">取消</button><button type="button" class="danger-button" data-action="confirm-delete">确认删除</button></div>
  </dialog>
  <!-- NOOBAI_RUNTIME_CONFIG -->
  <script src="/app/web/assets/runtime.js"></script>
  <script src="/app/web/assets/http-client.js"></script>
  <script src="/app/web/assets/pagination.js"></script>
  <script type="module" src="/app/web/assets/management-navigation.js"></script>
  <script type="module" src="/app/web/assets/prompt-term-management.js"></script>
</body>
</html>
