<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ComfyUI 模板管理 · 管理</title>
  <link rel="stylesheet" href="/app/web/assets/management.css">
</head>
<body data-page="comfyui-templates">
  <a class="skip-link" href="#generation-resource-content">跳到主要内容</a>
  <main id="generation-resource-content" class="manage-shell">
    <nav id="management-navigation" class="management-navigation" data-management-page-id="comfyui-template-management" data-management-initial-focus="#template-search" aria-label="管理菜单"></nav>
    <div id="comfyui-template-section" class="generation-model-section list-view">
      <header class="resource-section-heading page-heading">
        <div class="page-heading-copy"><h1 id="template-heading">ComfyUI 模板管理</h1><p>维护 Workflow JSON、模型关系和模板封面。</p></div>
        <button type="button" class="accent-button" data-action="open-template-create">新增 ComfyUI 模板</button>
      </header>
      <form id="template-filter-form" class="manage-toolbar" aria-label="ComfyUI 模板筛选">
        <label>关键词<input id="template-search" type="search" placeholder="搜索模板名称、Workflow JSON 内容" autocomplete="off"></label>
        <label>底模<select id="template-filter-base-model"><option value="">全部底模</option></select></label>
        <label>模型<select id="template-filter-model"><option value="">全部模型</option></select></label>
        <label>LoRA<select id="template-filter-lora"><option value="">全部 LoRA</option></select></label>
        <label>工作流类型<select id="template-filter-type"><option value="">全部类型</option></select></label>
        <div class="filter-actions"><button type="submit" class="accent-button">搜索</button><button type="button" class="secondary-button" data-action="reset-filters">重置</button></div>
      </form>
      <p id="template-status" class="state-line" role="status" aria-live="polite" aria-busy="true">正在载入 ComfyUI 模板……</p>
      <p id="template-error" class="state-line error" role="alert" hidden></p>
      <section id="template-list" class="manage-list" aria-label="ComfyUI 模板列表"></section>
      <nav id="template-pagination" class="manage-pagination" aria-label="ComfyUI 模板分页"></nav>
    </div>
  </main>

  <dialog id="template-editor" class="manage-dialog model-editor" aria-labelledby="template-editor-title">
    <div class="dialog-heading"><div><h2 id="template-editor-title">新增 ComfyUI 模板</h2><p id="template-editor-subtitle" class="editor-subtitle"></p></div><button type="button" class="icon-button" data-action="close-template-editor" aria-label="关闭编辑弹窗">×</button></div>
    <div class="detail-body">
      <form id="template-form">
        <section>
          <div class="model-form-grid">
            <label>底模<select name="base_model_id" required><option value="">请选择底模</option></select></label>
            <label>模型<select name="model_id" required><option value="">请选择模型</option></select></label>
            <label>LoRA<select name="lora_id"><option value="">不关联 LoRA</option></select></label>
            <label>模板类型<select name="template_type" required><option value="text_to_image">文生图</option><option value="text_to_image_lora">文生图 LoRA</option><option value="text_to_image_hires_fix">文生图高清修复</option><option value="text_to_image_second_pass">文生图二次处理</option><option value="text_to_video">文生视频</option><option value="image_to_image">图生图</option><option value="image_to_video">图生视频</option><option value="video_to_video">视频转视频</option><option value="style_transfer">风格迁移</option><option value="controlnet">ControlNet</option><option value="inpainting">局部重绘</option><option value="outpainting">扩图</option><option value="upscale">放大</option><option value="face_detailer">面部修复</option><option value="other">其他</option></select></label>
            <label>名称<input name="title" required autocomplete="off"></label>
          </div>
        </section>
        <section>
          <div class="workflow-upload-row"><input id="template-json-file" type="file" accept=".json,application/json" hidden><button type="button" class="secondary-button" data-action="choose-template-json">上传 Workflow JSON</button><span id="template-json-file-status" role="status" aria-live="polite">也可以直接编辑下方 JSON。</span></div>
          <label>Workflow JSON<textarea name="template_json" required rows="18" spellcheck="false" aria-describedby="template-json-help"></textarea></label>
          <p id="template-json-help" class="field-help">管理员可直接粘贴从 ComfyUI 导出的 Workflow JSON。系统支持 0.4 和 1.0 格式。</p>
        </section>
        <p id="template-editor-error" class="state-line error" role="alert" hidden></p>
      </form>
      <section id="template-media-section" class="model-media-section" hidden aria-labelledby="template-media-heading">
        <h3 id="template-media-heading">模板封面</h3>
        <div id="template-image-upload-controls" class="detail-toolbar"><label>选择封面<input id="template-image-upload" type="file" accept="image/jpeg,image/png,image/webp"></label><button type="button" class="accent-button" data-action="upload-template-image">上传封面</button></div>
        <p id="template-media-status" class="state-line" aria-live="polite"></p>
        <div id="template-image-list" class="detail-image-grid"></div>
      </section>
    </div>
    <div class="dialog-actions editor-dialog-actions" data-template-editor-actions><button id="template-editor-delete" type="button" class="danger-button" data-action="open-template-delete" hidden>删除</button><button id="template-editor-submit" type="submit" form="template-form" class="accent-button">创建 ComfyUI 模板</button></div>
  </dialog>

  <dialog id="template-delete" class="manage-dialog confirm-dialog" aria-labelledby="template-delete-title">
    <div class="dialog-heading"><div><p class="eyebrow">危险操作</p><h2 id="template-delete-title">确认删除 ComfyUI 模板</h2></div><button type="button" class="icon-button" data-action="close-template-delete" aria-label="关闭 ComfyUI 模板删除预览">×</button></div>
    <p id="template-delete-target"></p>
    <section><h3>级联删除</h3><ul id="template-cascade-list"></ul></section>
    <section><h3>解除关联但保留</h3><ul id="template-retained-list"></ul></section>
    <p id="template-delete-error" class="state-line error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" class="secondary-button" data-action="close-template-delete">取消</button><button type="button" class="danger-button" data-action="confirm-template-delete">确认删除</button></div>
  </dialog>

  <dialog id="template-image-delete" class="manage-dialog confirm-dialog" aria-labelledby="template-image-delete-title">
    <div class="dialog-heading"><div><p class="eyebrow">删除模板封面</p><h2 id="template-image-delete-title">确认删除图片</h2></div><button type="button" class="icon-button" data-action="close-template-image-delete" aria-label="取消删除模板封面">×</button></div>
    <p id="template-image-delete-target"></p>
    <div class="dialog-actions"><button type="button" class="secondary-button" data-action="close-template-image-delete">取消</button><button type="button" class="danger-button" data-action="confirm-template-image-delete">确认删除</button></div>
  </dialog>
  <dialog id="template-image-preview" class="manage-dialog image-preview-dialog" aria-labelledby="template-image-preview-title">
    <div class="dialog-heading"><div><h2 id="template-image-preview-title">查看原图</h2><p class="state-line">模板封面</p></div><button type="button" class="icon-button" data-action="close-template-image-preview" aria-label="关闭原图预览">×</button></div>
    <div class="image-preview-stage"><button type="button" class="image-preview-arrow" aria-label="显示上一张图" disabled>←</button><img id="template-image-preview-image" alt="模板封面原图"><button type="button" class="image-preview-arrow" aria-label="显示下一张图" disabled>→</button></div>
  </dialog>
  <!-- NOOBAI_RUNTIME_CONFIG -->
  <script src="/app/web/assets/runtime.js"></script>
  <script src="/app/web/assets/http-client.js"></script>
  <script src="/app/web/assets/pagination.js"></script>
  <script type="module" src="/app/web/assets/management-navigation.js"></script>
  <script type="module" src="/app/web/assets/comfyui-template-management.js"></script>
</body>
</html>
