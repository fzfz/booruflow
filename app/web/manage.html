<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BooruFlow · 管理</title>
  <link rel="stylesheet" href="/app/web/assets/management.css">
</head>
<body data-page="manage">
  <a class="skip-link" href="#manage-content">跳到主要内容</a>
  <main id="manage-content" class="manage-shell">
    <nav id="management-navigation" class="management-navigation" data-management-page-id="catalog-management" data-management-initial-focus="#manage-search" aria-label="管理菜单"></nav>
    <section class="generation-model-section list-view">
    <header class="resource-section-heading page-heading">
      <div class="page-heading-copy"><h1>角色画师管理</h1><p>维护作品、角色、画风、说明和资源图片。</p></div>
      <button type="button" class="accent-button" data-action="open-create">新增档案</button>
    </header>
    <form id="manage-filter-form" class="manage-toolbar" aria-label="档案筛选">
      <label>关键词<input id="manage-search" type="search" placeholder="搜索名称、别名、作品名称、提示词、画风描述" autocomplete="off"></label>
      <label>类型<select id="manage-kind"><option value="all">全部</option><option value="work">作品</option><option value="character">角色</option><option value="style">画风</option></select></label>
      <label>底模<select id="manage-base-model"><option value="">全部底模</option></select></label>
      <label>可用状态<select id="manage-availability"><option value="">全部状态</option><option value="available">可用</option><option value="unavailable">停用</option></select></label>
      <div class="filter-actions"><button id="manage-search-submit" class="accent-button" type="submit" data-action="submit-search">搜索</button><button class="secondary-button" type="button" data-action="reset-filters">重置</button></div>
    </form>
    <p id="manage-status" class="state-line" role="status" aria-live="polite" aria-busy="true">正在载入档案……</p>
    <p id="manage-error" class="state-line error" role="alert" hidden></p>
    <section id="manage-list" class="manage-list" aria-label="档案列表"></section>
    <nav id="manage-pagination" class="manage-pagination" aria-label="管理目录分页"></nav>
    </section>
  </main>

  <dialog id="manage-detail" class="manage-dialog model-editor" aria-labelledby="detail-title">
    <div class="dialog-heading"><div><h2 id="detail-title">新增档案</h2><p id="detail-subtitle" class="editor-subtitle"></p></div><button type="button" class="icon-button" data-action="close-detail" aria-label="关闭编辑弹窗">×</button></div>
    <div id="detail-body" class="detail-body editor-body" aria-live="polite">
      <form id="manage-editor-form" class="editor-form-pane">
        <label id="manage-create-kind-field">资源类型<select id="manage-create-kind" name="kind"><option value="work">作品</option><option value="character">角色</option><option value="style">画风</option></select></label>
        <div id="manage-editor-fields"></div>
        <p id="manage-editor-error" class="state-line error" role="alert" hidden></p>
      </form>
      <aside id="manage-editor-media" class="editor-media-pane">
        <section class="editor-side-card">
          <h3>资源图片</h3>
          <input id="manage-cover-upload" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <input id="manage-image-upload" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
          <div class="editor-media-actions"><button type="button" class="secondary-button" data-action="choose-cover">更换封面</button><button type="button" class="secondary-button" data-action="open-image-manager">管理图片</button></div>
          <p id="manage-media-status" class="state-line" role="status" aria-live="polite"></p>
          <div id="manage-image-list" class="editor-media-summary"></div>
        </section>
        <section id="manage-record-info" class="record-info-panel"></section>
      </aside>
    </div>
    <div class="dialog-actions editor-dialog-actions"><button id="manage-editor-delete" type="button" class="danger-button" data-action="delete-current" hidden>删除</button><span id="manage-editor-status" class="state-line" role="status" aria-live="polite"></span><button id="manage-editor-submit" type="submit" form="manage-editor-form" class="accent-button">创建档案</button></div>
  </dialog>
  <dialog id="manage-confirm" class="manage-dialog confirm-dialog" aria-labelledby="confirm-title">
    <div class="dialog-heading"><div><p class="eyebrow">危险操作</p><h2 id="confirm-title">确认删除</h2></div><button class="icon-button" data-action="cancel-confirm" aria-label="取消">×</button></div>
    <p id="confirm-copy"></p><div class="dialog-actions"><button class="secondary-button" data-action="cancel-confirm">取消</button><button class="danger-button" data-action="confirm-delete">确认删除</button></div>
  </dialog>
  <dialog id="manage-image-manager" class="manage-dialog image-manager-dialog" aria-labelledby="manage-image-manager-title">
    <div class="dialog-heading"><div><p class="eyebrow">资源图片</p><h2 id="manage-image-manager-title">管理图片</h2></div><div class="image-manager-heading-actions"><button type="button" class="secondary-button" data-action="choose-images">添加图片</button><button type="button" class="accent-button" data-action="close-image-manager">完成</button></div></div>
    <div id="manage-image-manager-grid" class="image-manager-grid"></div>
    <footer class="image-manager-footer"><p id="manage-image-manager-range" class="state-line"></p><div class="image-manager-pagination"><button type="button" class="secondary-button" data-action="previous-image-group" aria-label="显示前 3 张图片">← 前 3 张</button><button type="button" class="secondary-button" data-action="next-image-group" aria-label="显示后 3 张图片">后 3 张 →</button></div></footer>
  </dialog>
  <dialog id="manage-image-preview" class="manage-dialog image-preview-dialog" aria-labelledby="manage-image-preview-title">
    <div class="dialog-heading"><div><h2 id="manage-image-preview-title">查看原图</h2><p id="manage-image-preview-count" class="state-line"></p></div><button type="button" class="icon-button" data-action="close-image-preview" aria-label="关闭原图预览">×</button></div>
    <div class="image-preview-stage"><button type="button" class="image-preview-arrow" data-action="previous-image-preview" aria-label="显示上一张图">←</button><img id="manage-image-preview-image" alt="资源原图"><button type="button" class="image-preview-arrow" data-action="next-image-preview" aria-label="显示下一张图">→</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <!-- NOOBAI_RUNTIME_CONFIG -->
  <script src="/app/web/assets/runtime.js"></script>
  <script src="/app/web/assets/http-client.js"></script>
  <script src="/app/web/assets/pagination.js"></script>
  <script type="module" src="/app/web/assets/management-navigation.js"></script>
  <script type="module" src="/app/web/assets/manage.js"></script>
</body>
</html>
