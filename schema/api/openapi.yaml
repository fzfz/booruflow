      type: object
      additionalProperties: false
      required:
        - ok
        - request_id
        - error
      properties:
        ok:
          const: false
          description: Error envelope marker
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Server-generated correlation value for this HTTP response and server logs; it is not a task identity
          replay key: null
          idempotency key: null
          or submission-guard input: null
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          description: Error details
          properties:
            code:
              type: string
              description: Stable service error code
            message:
              type: string
              description: Human-readable service error detail
            user_may_resubmit:
              type: boolean
              description: Canonical error-catalog permission to submit a new request
            display:
