components:
  parameters:
    WorkId:
      name: work_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CharacterId:
      name: character_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StyleId:
      name: style_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SourceInstanceId:
      name: instance_id
      in: path
      required: true
      description: Stable decimal positive integer string identifier for a registered ComfyUI instance
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: ^[1-9][0-9]{0,19}$
    SourceTemplateId:
      name: template_id
      in: path
      required: true
      description: Stable decimal positive integer string identifier for a registered ComfyUI template
      schema:
        type: string
        minLength: 1
        maxLength: 20
        pattern: ^[1-9][0-9]{0,19}$
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Id:
      name: id
      in: path
      required: true
      description: Decimal safe positive integer identifier; exponent notation
      signs: null
      decimals: null
      and values above Number.MAX_SAFE_INTEGER are invalid: null
      schema:
        $ref: "#/components/schemas/SafePositiveIntegerId"
    ItemKind:
      name: kind
      in: path
      required: true
      schema:
        enum:
          - work
          - character
          - style
    OwnerId:
      name: owner_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OwnerKind:
      name: owner_kind
      in: path
      required: true
      schema:
        enum:
          - work
          - character
          - style
          - model
          - lora
          - artist_prompt_string
          - template
    SearchQuery:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    SemanticQuery:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    SemanticBaseModelName:
      name: base_model_name
      in: query
      required: true
      description: Exact generation_base_models.name used to scope Style retrieval; leading and trailing whitespace is invalid
      example: WAI
      schema:
        type: string
        minLength: 1
        example: WAI
    SemanticLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 20
    SemanticWorkId:
      name: work_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    HomeSearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
        default: ""
    HomeLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    HomeCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ManageKind:
      name: kind
      in: query
      required: false
      schema:
        enum:
          - all
          - work
          - character
          - style
        default: all
    ManageSearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
        default: ""
    ManageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 16
    ManagePage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 16
    Q:
      name: q
      in: query
      required: false
      description: 最多 100 个 UTF-16 code units
      schema:
        type: string
        maxLength: 100
        default: ""
    PromptTermCategoryFilter:
      name: category
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PromptTermCategoryCode"
    PromptTermPostCountMin:
      name: post_count_min
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    PromptTermPostCountMax:
      name: post_count_max
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    BaseModelFilter:
      name: base_model_id
      in: query
      required: false
      description: Decimal safe positive integer base-model identifier; validate the complete raw query value before numeric conversion
      schema:
        $ref: "#/components/schemas/SafePositiveIntegerId"
    ModelFilter:
      name: model_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    LoraFilter:
      name: lora_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    StyleFilter:
      name: style_id
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    ManageAvailabilityFilter:
      name: availability
      in: query
      required: false
      schema:
        type: string
        enum:
          - available
          - unavailable
    FileFormatFilter:
      name: file_format
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/FileFormat"
    PrecisionFilter:
      name: precision_or_quantization
      in: query
      required: false
      schema:
