    CatalogSourceResultRecord:
      type: object
      additionalProperties: true
      description: One database result record. The service preserves database column names and database value types, parses stored JSON text into JSON values, qualifies same-name joined columns as table.column, and may replace cover_media_path with cover_url.
    CatalogSampleImageResultRecord:
      allOf:
        - $ref: "#/components/schemas/CatalogSourceResultRecord"
        - type: object
          required:
            - sample_image_urls
          properties:
            sample_image_urls:
              type: array
              uniqueItems: true
              description: Ordered non-cover image URLs for the current Catalog record.
              items:
                type: string
                format: uri
                pattern: '^http://127\.0\.0\.1:(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])/.+$'
                description: Loopback media URL generated from one non-cover item_images.media_path value.
                example: http://127.0.0.1:18092/media/images/example-2.webp
    CatalogSourceSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - message
        - results
        - page
        - page_size
        - total_count
      description: Common successful Catalog or Host Source response.
      properties:
        status:
          const: ok
          description: The request completed successfully.
          example: ok
        message:
          type: "null"
          description: Successful responses contain null.
          example: null
        results:
          type: array
          maxItems: 100
          description: Database result records in the service-defined order.
          example: []
          items:
            $ref: "#/components/schemas/CatalogSourceResultRecord"
        page:
          type: integer
          minimum: 1
          description: One-based result page number.
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of result records requested or returned for this page.
          example: 20
        total_count:
          type: integer
          minimum: 0
          description: Total matching database records before pagination.
          example: 0
    CatalogSampleImageSuccess:
      $ref: "#/components/schemas/CatalogSourceSuccess"
      properties:
        results:
          type: array
          maxItems: 100
          description: Catalog result records with ordered non-cover image URLs.
          items:
            $ref: "#/components/schemas/CatalogSampleImageResultRecord"
    CatalogSourceError:
      type: object
      additionalProperties: false
      required:
        - status
        - message
        - results
        - page
        - page_size
        - total_count
      description: Common failed Catalog or Host Source response.
      properties:
        status:
          const: error
          description: The request failed.
          example: error
        message:
          type: string
          minLength: 1
          description: The concrete request failure message.
          example: Catalog request is invalid.
        results:
          type: array
          maxItems: 0
          description: Failed responses contain an empty array.
          example: []
          items:
            $ref: "#/components/schemas/CatalogSourceResultRecord"
        page:
          const: 1
          description: Failed responses use page 1.
          example: 1
        page_size:
          const: 0
          description: Failed responses contain no result records.
          example: 0
        total_count:
          const: 0
          description: Failed responses expose no matching record count.
          example: 0
