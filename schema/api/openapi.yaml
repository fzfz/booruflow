openapi: 3.1.0
info:
  title: BooruFlow 本地资源管理 API
  version: 1.0.0
  description: 公开监听器只提供 `/api/*`；回环监听器提供 `/internal/semantic`、`/internal/semantic/*` 与 `/internal/comfyui-source/*`。公开监听器访问任一内部前缀固定返回 404。GET `/internal/semantic` 返回 Catalog discovery JSON；Catalog operation 成功响应直接返回 CatalogPage，错误响应直接返回 error 对象，均不含 `request_id`。
paths:
  /api/works:
    get:
      operationId: listWorks
      parameters:
        - $ref: "#/components/parameters/HomeSearchQuery"
        - $ref: "#/components/parameters/HomeLimit"
        - $ref: "#/components/parameters/HomeCursor"
