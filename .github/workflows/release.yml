name: Release checks
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check whitespace
        shell: bash
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Scan tracked files for credential leaks
        shell: bash
        run: |
          if git grep -nEI '(^|[^[:alnum:]_])(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})'; then # credential leak scan
            echo 'credential leak detected'
            exit 1
          fi
      - name: Check test boundaries
        run: npm run check:test-markdown
      - name: Run contract tests
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: npm run test:contract
      - name: Run unit tests
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: npm run test:unit
      - name: Run integration tests
        if: ${{ !cancelled() }}
        run: npm run test:integration
      - name: Check Windows database and data transfer
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node --test tests/unit/data-package/import.test.mjs tests/contract/issue-89-production-runtime-data.test.mjs
      - name: Run migration tests
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: node scripts/run-test-layer.mjs tests/migration/
      - name: Run native script tests
        if: ${{ !cancelled() }}
        run: node scripts/run-test-layer.mjs tests/native/
      - name: Run browser tests
        if: ${{ !cancelled() }}
        run: node scripts/run-e2e-tests.mjs
      - name: Install published tag and exercise macOS lifecycle
        if: ${{ !cancelled() && runner.os == 'macOS' && github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -e
          smoke="$RUNNER_TEMP/安装 smoke"
          mkdir "$smoke"
          cp install.sh "$smoke/install.sh"
          cd "$smoke"
          printf '\n' | bash install.sh --tag "$GITHUB_REF_NAME"
          for name in EMBEDDING RERANKER; do
            sed -i '' "s|^NOOBAI_${name}_BASE_URL=$|NOOBAI_${name}_BASE_URL=http://127.0.0.1:59999/v1|; s|^NOOBAI_${name}_API_KEY=$|NOOBAI_${name}_API_KEY=test|; s|^NOOBAI_${name}_MODEL=$|NOOBAI_${name}_MODEL=test|" .env
          done
          bash check.sh
          trap 'bash stop.sh' EXIT
          bash start.sh
          bash status.sh
          bash stop.sh
          trap - EXIT
          bash backup.sh
          test -z "$(git status --porcelain)"
      - name: Install published tag and exercise Windows lifecycle
        if: ${{ !cancelled() && runner.os == 'Windows' && github.ref_type == 'tag' }}
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP '安装 smoke'
          New-Item -ItemType Directory -Path $smoke | Out-Null
          Copy-Item install.bat (Join-Path $smoke 'install.bat')
          Set-Location $smoke
          '' | & cmd.exe /d /c install.bat --tag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Native installation failed' }
          $configuration = Get-Content .env -Raw
          foreach ($name in @('EMBEDDING', 'RERANKER')) {
            $configuration = $configuration -replace "(?m)^NOOBAI_${name}_BASE_URL=\r?$", "NOOBAI_${name}_BASE_URL=http://127.0.0.1:59999/v1"
            $configuration = $configuration -replace "(?m)^NOOBAI_${name}_API_KEY=\r?$", "NOOBAI_${name}_API_KEY=test"
            $configuration = $configuration -replace "(?m)^NOOBAI_${name}_MODEL=\r?$", "NOOBAI_${name}_MODEL=test"
          }
          Set-Content .env $configuration -Encoding utf8NoBOM
          try {
            foreach ($operation in @('check', 'start', 'status')) {
              & cmd.exe /d /c "$operation.bat"
              if ($LASTEXITCODE -ne 0) { throw "Native $operation failed" }
            }
          } finally {
            & cmd.exe /d /c stop.bat
            if ($LASTEXITCODE -ne 0) { throw 'Native stop failed' }
          }
          & cmd.exe /d /c backup.bat
          if ($LASTEXITCODE -ne 0) { throw 'Native backup failed' }
          if (git status --porcelain) { throw 'Installation changed tracked files' }
      - name: Export platform data package
        if: ${{ !cancelled() }}
        run: node scripts/test-data-exchange.mjs export outputs/exchange
      - uses: actions/upload-artifact@v4
        with:
          name: exchange-${{ matrix.os }}
          path: outputs/exchange/
          if-no-files-found: error
          retention-days: 7
  interchange:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: exchange-*
          path: outputs/incoming
      - name: Import packages from all three platforms
        run: node scripts/test-data-exchange.mjs import outputs/incoming
